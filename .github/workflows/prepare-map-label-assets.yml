name: Prepare canonical map label assets
on:
  create:
  push:
    branches: [codex/map-label-assets-20261121]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'st-agnes/ingatlan' && github.ref == 'refs/heads/codex/map-label-assets-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install native geometry runtime
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgeos-c1t64
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            /data/neighborhoods/search-areas.geojson.gz
            /data/neighborhoods/sources/country-osm/municipalities.geojson.gz
            /data/neighborhoods/sources/country-osm/named-nodes.geojson.gz
      - name: Generate pinned public display assets and verify exact tree
        run: |
          python3 scripts/build-neighborhood-map.py
          python3 scripts/build-neighborhood-map.py --check
          git add dist/data/map
          otthonra_asset_tree=$(git write-tree)
          git rev-parse "$otthonra_asset_tree:dist/data/map"
          sha256sum dist/data/map/labels.json
          git diff --stat
          git ls-tree "$otthonra_asset_tree:dist/data/map" > /tmp/map-asset-entries.txt
          sha256sum /tmp/map-asset-entries.txt
          git -c user.name='Otthonra asset preparation' -c user.email='asset-preparation@example.test' -c commit.gpgsign=false commit -m 'Generate verified canonical label and selected town display assets'
          git push origin HEAD:refs/heads/codex/map-label-assets-20261121
          git rev-parse HEAD
          git rev-parse HEAD:dist/data/map
