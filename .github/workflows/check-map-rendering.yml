name: Check public listing, address privacy and energy contracts
on:
  push:
    branches: [codex/map-label-check-20261121]
permissions:
  contents: read
jobs:
  dotnet:
    if: github.repository == 'st-agnes/ingatlan' && github.ref == 'refs/heads/codex/map-label-check-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            /data/streets/
            /data/neighborhoods/search-areas.geojson.gz
            /data/neighborhoods/sources/country-osm/municipalities.geojson.gz
            /data/neighborhoods/sources/country-osm/named-nodes.geojson.gz
      - uses: ./.github/actions/ci-dotnet
      - name: Verify actual .NET model and bounded contact checks
        run: dotnet test backend/Otthonra.Tests/Otthonra.Tests.csproj --configuration Release
