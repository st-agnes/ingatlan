name: Check visual property-type wizard
on:
  push:
    branches: [codex/map-label-check-20261121]
permissions:
  contents: write
jobs:
  browser:
    if: github.repository == 'st-agnes/ingatlan' && github.ref == 'refs/heads/codex/map-label-check-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        suite: [wizard-dock, onboarding, neighborhood-map]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
      - uses: ./.github/actions/ci-node
        with:
          browser: 'true'
      - name: Exercise the actual six-step browser flow
        run: |
          set -o pipefail
          mkdir -p .local/browser-tests
          git rev-parse HEAD
          python3 -m http.server 3000 --directory dist --bind 127.0.0.1 > .local/browser-tests/visual-server.log 2>&1 &
          node tests/${{ matrix.suite }}-browser.test.mjs http://127.0.0.1:3000 2>&1 | tee .local/browser-tests/visual-${{ matrix.suite }}.log
      - name: Preserve bounded public diagnostic output
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VISUAL_SUITE: ${{ matrix.suite }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          logs=list(Path('.local/browser-tests').glob('visual-*.log'))
          shots=list(Path('.local/browser-tests/screenshots').glob('visual-type-*.png'))+sorted(Path('.local/browser-tests/screenshots').glob('*failure*.png'))[:3]
          for path in logs+shots:
              if not path.is_file():continue
              raw=path.read_bytes()
              if len(raw)>3000000:continue
              content=base64.b64encode(raw) if path.suffix=='.png' else raw
              payload=json.dumps({'encoding':'base64','content':base64.b64encode(content).decode()}).encode()
              request=urllib.request.Request('https://api.github.com/repos/st-agnes/ingatlan/git/blobs',data=payload,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response:result=json.load(response)
              expected=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest();assert result['sha']==expected
              print(json.dumps({'suite':os.environ['VISUAL_SUITE'],'file':path.name,'sha':expected,'bytes':len(raw),'encoding':'base64-text' if path.suffix=='.png' else 'utf8'}))
          PY
