name: Build and integration tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guided-forms-and-discovery:
    name: Guided forms and discovery controls
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned headless browser tools
        timeout-minutes: 5
        run: |
          npm install --prefix .local/browser-tests --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          .local/browser-tests/node_modules/.bin/playwright install --only-shell chromium
      - name: Test guided forms and fixed discovery actions without backend setup
        run: |
          set -o pipefail
          mkdir -p .local/browser-tests
          python3 -m http.server 3000 --directory dist --bind 127.0.0.1 > .local/browser-tests/guided-static-server.log 2>&1 &
          guided_frontend_pid=$!
          trap 'kill "$guided_frontend_pid" 2>/dev/null || true' EXIT
          node --input-type=module - <<'JS'
          const deadline = Date.now() + 10000;
          let ready = false;
          while (Date.now() < deadline) {
            try {
              const response = await fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(500)});
              if (response.ok) { ready = true; break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 200));
          }
          if (!ready) throw new Error('The static frontend did not become ready within ten seconds.');
          JS
          node tests/wizard-dock-browser.test.mjs http://127.0.0.1:3000 2>&1 | tee .local/browser-tests/guided-ui.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: guided-forms-discovery-browser-failure
          path: |
            .local/browser-tests/screenshots/wizard-dock-*.png
            .local/browser-tests/guided-*.log
          if-no-files-found: ignore
  build-and-test:
    name: Build and test (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "8.4"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_DATABASE: otthonra_ci
          MYSQL_USER: otthonra
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="MYSQL_PWD=ci-only-password mysql -h 127.0.0.1 -u otthonra otthonra_ci -e 'SELECT 1' >/dev/null 2>&1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MySql: Server=127.0.0.1;Port=3306;Database=otthonra_ci;User=otthonra;Password=ci-only-password
      Jwt__Key: ci-only-signing-key-for-disposable-test-environment-2026
      Database__Initialize: "true"
      Database__SeedDemo: "true"
      Database__SeedTestFixtures: "false"
      Credits__EnableDemoTopup: "true"
      OTTHONRA_UPGRADE_FIXTURE: .local/upgrade-fixture.json
      OTTHONRA_TEST_MYSQL_CACHING_SHA2: "true"
      OTTHONRA_TEST_MYSQL_USER: otthonra_proxy_ci
      OTTHONRA_TEST_MYSQL_PASSWORD: ci-only-proxy-password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore and build .NET
        run: |
          dotnet restore backend/Otthonra.Tests/Otthonra.Tests.csproj
          dotnet build backend/Otthonra.Tests/Otthonra.Tests.csproj --configuration Release --no-restore
      - name: Create a fresh account for the proxy TCP authentication regression
        run: docker exec --env MYSQL_PWD=ci-only-root-password "${{ job.services.mysql.id }}" mysql --user=root --execute="CREATE USER 'otthonra_proxy_ci'@'%' IDENTIFIED WITH caching_sha2_password BY 'ci-only-proxy-password'; GRANT SELECT ON otthonra_ci.* TO 'otthonra_proxy_ci'@'%';"
      - name: Run .NET unit tests
        run: dotnet test backend/Otthonra.Tests/Otthonra.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Verify the embedded test catalog matches its source
        run: node scripts/gcp/export-demo-data.mjs --check
      - name: Build Docker API with embedded location catalogue
        run: docker build --file backend/Dockerfile --tag otthonra-api:ci .
      - name: Verify the pinned Cloud SQL proxy image and required CLI flags
        run: |
          mkdir -p .local/proxy-smoke
          proxy_image='gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.26.3'
          docker pull "$proxy_image"
          docker run --rm "$proxy_image" --version > .local/proxy-smoke/version.txt
          docker run --rm "$proxy_image" --help > .local/proxy-smoke/help.txt
          python3 - <<'PY'
          from pathlib import Path
          version=Path('.local/proxy-smoke/version.txt').read_text()
          help_text=Path('.local/proxy-smoke/help.txt').read_text()
          assert '2.26.3' in version, 'Unexpected Cloud SQL proxy version'
          for flag in ['--address', '--port', '--structured-logs', '--health-check', '--http-address', '--http-port', '--lazy-refresh']:
              assert flag in help_text, 'Missing Cloud SQL proxy flag: '+flag
          print(version.strip())
          print('Pinned proxy CLI flags verified.')
          PY
          docker image inspect "$proxy_image" --format '{{json .RepoDigests}}'
      - name: Run JavaScript tests
        run: |
          node tests/model.test.mjs
          node tests/feedback.test.mjs
          node tests/seller-feedback-model.test.mjs
          node tests/matching.test.mjs
          node tests/public-profile.test.mjs
          node tests/smoke-privacy.test.mjs
          node tests/frontend.test.mjs
          node tests/api.test.mjs
          node tests/seller-feedback-api.test.mjs
          node tests/accounts.test.mjs
          node tests/development.test.mjs
          node tests/locations.test.mjs
          node tests/areas.test.mjs
          node tests/regions.test.mjs
          node tests/attributes.test.mjs
          node tests/gcp-deployment.test.mjs
          node tests/gcp-verification.test.mjs
          node tests/gcp-run-config.test.mjs
          node tests/gcp-bootstrap.test.mjs
          node tests/gcp-mysql.test.mjs
          node tests/gcp-firebase.test.mjs
          node tests/gcp-runner.test.mjs
          node tests/gcp-push.test.mjs
          node tests/gcp-status.test.mjs
          node tests/gcp-seed.test.mjs
          node tests/demo-data.test.mjs
          node tests/startup-seed-packaging.test.mjs
      - name: Check Cloud Shell script syntax
        run: |
          bash -n scripts/gcp/bootstrap-dev.sh
          bash -n scripts/gcp/deploy-dev.sh
          bash -n scripts/gcp/run-dev.sh
          bash -n scripts/gcp/push-image.sh
          python3 -m py_compile scripts/gcp/bootstrap-dev.py
      - name: Start the actual development supervisor with seeded MySQL
        run: node scripts/dev.mjs --background
      - name: Test real development restarts, recovery and configured ports
        run: node tests/development-smoke.mjs
      - name: Test real MySQL and API flows through web proxy
        run: node backend/smoke.mjs http://127.0.0.1:3000
      - name: Test graded matching, ranking and consent through the real MySQL API
        run: |
          node backend/matching-smoke.mjs http://127.0.0.1:3000
          python3 backend/matching-store-smoke.py "${{ job.services.mysql.id }}"
      - name: Preserve an existing notification table through the feedback upgrade
        run: |
          node scripts/dev.mjs --stop
          python3 backend/seller-feedback-store.py "${{ job.services.mysql.id }}" legacy-notification
          node scripts/dev.mjs --background
          python3 backend/seller-feedback-store.py "${{ job.services.mysql.id }}" upgraded-notification
          node scripts/dev.mjs --restart
          python3 backend/seller-feedback-store.py "${{ job.services.mysql.id }}" preserved-notification
      - name: Verify seller statistics, paid feedback, quota races and exactly-once package refunds
        run: |
          node backend/seller-feedback-smoke.mjs http://127.0.0.1:3000 --setup
          python3 backend/seller-feedback-store.py "${{ job.services.mysql.id }}" prime
          node backend/seller-feedback-smoke.mjs http://127.0.0.1:3000 --responses
          python3 backend/seller-feedback-store.py "${{ job.services.mysql.id }}" capacity
          node backend/seller-feedback-smoke.mjs http://127.0.0.1:3000 --capacity
          python3 backend/seller-feedback-store.py "${{ job.services.mysql.id }}" age
          node backend/seller-feedback-smoke.mjs http://127.0.0.1:3000 --expired
          python3 backend/seller-feedback-store.py "${{ job.services.mysql.id }}" record
          node scripts/dev.mjs --restart
          node backend/seller-feedback-smoke.mjs http://127.0.0.1:3000 --preserved
          python3 backend/seller-feedback-store.py "${{ job.services.mysql.id }}" verify
      - name: Install browser regression tools
        timeout-minutes: 5
        run: |
          # Ubuntu 24.04 runners include Chromium's system libraries. Avoid apt
          # mirror/font downloads; retain Playwright's exact headless browser.
          npm install --prefix .local/browser-tests --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          .local/browser-tests/node_modules/.bin/playwright install --only-shell chromium
      - name: Test themed editors and always reachable discovery actions in Chromium
        run: node tests/wizard-dock-browser.test.mjs http://127.0.0.1:3000
      - name: Test location picker and search creation in Chromium
        run: node tests/browser.test.mjs http://127.0.0.1:3000
      - name: Test optional attributes in desktop, tablet and mobile Chromium
        run: node tests/attributes-browser.test.mjs http://127.0.0.1:3000
      - name: Test seller fields and numeric input on desktop, tablet and mobile
        run: node tests/seller-form-browser.test.mjs http://127.0.0.1:3000
      - name: Test account badges, reports, registration and agent search costs in Chromium
        run: node tests/broker-browser.test.mjs http://127.0.0.1:3000
      - name: Test incoming likes, account visibility and report reasons in Chromium
        run: node tests/interaction-browser.test.mjs http://127.0.0.1:3000
      - name: Test public landing, region fallback and refund notifications in Chromium
        run: node tests/landing-refund-browser.test.mjs http://127.0.0.1:3000
      - name: Test city-area selection on desktop, tablet and mobile
        run: node tests/areas-browser.test.mjs http://127.0.0.1:3000
      - name: Test exact-to-approximate discovery consent on desktop, tablet and mobile
        run: node tests/matching-browser.test.mjs http://127.0.0.1:3000
      - name: Test seller insights and one-click rejection feedback on desktop, tablet and mobile
        run: node tests/seller-feedback-browser.test.mjs http://127.0.0.1:3000
      - name: Simulate the previous schema in the disposable CI database
        run: |
          node scripts/dev.mjs --stop
          docker exec -i --env MYSQL_PWD=ci-only-password "${{ job.services.mysql.id }}" mysql --user=otthonra otthonra_ci < backend/fixtures/previous-schema.sql
      - name: Upgrade existing data and verify preservation
        run: |
          node scripts/dev.mjs --background
          node backend/upgrade-smoke.mjs http://127.0.0.1:3000
      - name: Verify schema upgrade is idempotent
        run: |
          node scripts/dev.mjs --stop
          node scripts/dev.mjs --background
          node backend/upgrade-smoke.mjs http://127.0.0.1:3000
      - name: Verify canonical search location backfill and covering indexes
        run: python3 backend/matching-store-smoke.py "${{ job.services.mysql.id }}"
      - name: Verify attributes, city areas and seller fields against MySQL and after a restart
        run: |
          node backend/attributes-smoke.mjs http://127.0.0.1:3000
          node backend/areas-smoke.mjs http://127.0.0.1:3000
          node backend/seller-form-smoke.mjs http://127.0.0.1:3000
          node scripts/dev.mjs --restart
          node backend/attributes-smoke.mjs http://127.0.0.1:3000 --verify
          node backend/areas-smoke.mjs http://127.0.0.1:3000 --verify
          node backend/seller-form-smoke.mjs http://127.0.0.1:3000 --verify
      - name: Verify broker billing, reports and UTC timestamp persistence
        run: |
          node scripts/dev.mjs --restart
          node backend/broker-smoke.mjs http://127.0.0.1:3000
          python3 backend/report-store-smoke.py "${{ job.services.mysql.id }}" record
          node scripts/dev.mjs --restart
          node backend/broker-smoke.mjs http://127.0.0.1:3000 --verify
          python3 backend/report-store-smoke.py "${{ job.services.mysql.id }}" verify
      - name: Verify incoming likes, account visibility and report-reason migration
        run: |
          node scripts/dev.mjs --restart
          node backend/interaction-smoke.mjs http://127.0.0.1:3000
          python3 backend/interaction-store-smoke.py "${{ job.services.mysql.id }}" record
          node scripts/dev.mjs --restart
          node backend/interaction-smoke.mjs http://127.0.0.1:3000 --verify
          python3 backend/interaction-store-smoke.py "${{ job.services.mysql.id }}" verify
          node scripts/dev.mjs --stop
          python3 backend/interaction-store-smoke.py "${{ job.services.mysql.id }}" legacy
          node scripts/dev.mjs --background
          node backend/interaction-smoke.mjs http://127.0.0.1:3000 --legacy-upgrade
          python3 backend/interaction-store-smoke.py "${{ job.services.mysql.id }}" upgraded
          node scripts/dev.mjs --restart
          python3 backend/interaction-store-smoke.py "${{ job.services.mysql.id }}" upgraded
      - name: Verify public landing privacy, reports and exactly-once overdue refunds on MySQL
        run: |
          node scripts/dev.mjs --restart
          node backend/landing-refund-smoke.mjs http://127.0.0.1:3000 --setup
          node scripts/dev.mjs --restart
          python3 backend/refund-store-smoke.py "${{ job.services.mysql.id }}" age
          node backend/landing-refund-smoke.mjs http://127.0.0.1:3000 --verify
          python3 backend/refund-store-smoke.py "${{ job.services.mysql.id }}" record
          node scripts/dev.mjs --restart
          node backend/landing-refund-smoke.mjs http://127.0.0.1:3000 --preserved
          python3 backend/refund-store-smoke.py "${{ job.services.mysql.id }}" verify
      - name: Verify diverse public samples change on refresh inside the candidate cache
        run: |
          node backend/landing-selection-smoke.mjs http://127.0.0.1:3000 --setup
          node scripts/dev.mjs --restart
          node backend/landing-selection-smoke.mjs http://127.0.0.1:3000 --verify
      - name: Start the API with the hosted test configuration
        run: |
          node scripts/dev.mjs --stop
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=test Database__SeedDemo=false node scripts/dev.mjs --background
      - name: Verify hosted test deployment capabilities
        run: |
          node backend/deployment-smoke.mjs http://127.0.0.1:3000 test
          node backend/smoke.mjs http://127.0.0.1:3000
      - name: Test hosted login, persistence and test credits in Chromium
        run: node tests/hosted-browser.test.mjs http://127.0.0.1:3000
      - name: Verify test fixtures and preservation through the real MySQL API
        run: |
          node scripts/dev.mjs --stop
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=test Database__SeedDemo=false node scripts/dev.mjs --background
          node backend/seed-smoke.mjs http://127.0.0.1:3000
      - name: Verify ordinary Production never exposes free credits
        run: |
          node scripts/dev.mjs --stop
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=production Database__SeedDemo=false node scripts/dev.mjs --background
          node backend/deployment-smoke.mjs http://127.0.0.1:3000 production
      - name: Verify embedded test fixtures and safe resets per deployment revision
        run: |
          node scripts/dev.mjs --stop
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=test Database__SeedDemo=false Database__SeedTestFixtures=true K_REVISION=ci-fixtures-a node scripts/dev.mjs --background
          node backend/startup-seed-smoke.mjs http://127.0.0.1:3000 --initial
          python3 backend/startup-seed-store.py "${{ job.services.mysql.id }}" changed
          node scripts/dev.mjs --stop
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=test Database__SeedDemo=false Database__SeedTestFixtures=true K_REVISION=ci-fixtures-a node scripts/dev.mjs --background
          node backend/startup-seed-smoke.mjs http://127.0.0.1:3000 --preserved
          node scripts/dev.mjs --stop
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=test Database__SeedDemo=false Database__SeedTestFixtures=true K_REVISION=ci-fixtures-b node scripts/dev.mjs --background
          node backend/startup-seed-smoke.mjs http://127.0.0.1:3000 --reset
          python3 backend/startup-seed-store.py "${{ job.services.mysql.id }}" reset
          node scripts/dev.mjs --stop
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=test Database__SeedDemo=false Database__SeedTestFixtures=true K_REVISION=ci-fixtures-a node scripts/dev.mjs --background
          node backend/startup-seed-smoke.mjs http://127.0.0.1:3000 --preserved
          node scripts/dev.mjs --stop
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=production Database__SeedDemo=false Database__SeedTestFixtures=true K_REVISION=ci-fixtures-production node scripts/dev.mjs --background
          node backend/startup-seed-smoke.mjs http://127.0.0.1:3000 --production
          python3 backend/startup-seed-store.py "${{ job.services.mysql.id }}" reset
      - name: Test the repeatable hosted feedback scenario on desktop, tablet and mobile
        run: |
          node scripts/dev.mjs --stop
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=test Database__SeedDemo=false Database__SeedTestFixtures=true K_REVISION=ci-fixtures-b node scripts/dev.mjs --background
          node tests/feedback-scenario-browser.test.mjs http://127.0.0.1:3000
      - name: Show development startup logs on failure
        if: failure()
        run: tail -n 80 .local/dev.log 2>/dev/null || true
      - name: Stop development supervisor
        if: always()
        run: node scripts/dev.mjs --stop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results-mysql-${{ matrix.mysql }}
          path: backend/Otthonra.Tests/TestResults/*.trx
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-screenshots-mysql-${{ matrix.mysql }}
          path: .local/browser-tests/screenshots/*.png
          if-no-files-found: ignore
