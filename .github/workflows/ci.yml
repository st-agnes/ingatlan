name: Build and integration tests

on:
  push:
    branches: [main, codex/google-cloud-test]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan CI validation
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      reuse: ${{ steps.plan.outputs.reuse }}
      source_run_id: ${{ steps.plan.outputs.source_run_id }}
      source_attempt: ${{ steps.plan.outputs.source_attempt }}
      tree: ${{ steps.plan.outputs.tree }}
      checkout_sha: ${{ steps.plan.outputs.checkout_sha }}
      workflow_blob_sha: ${{ steps.plan.outputs.workflow_blob_sha }}
      artifact_name: ${{ steps.plan.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Sparse checkout implicitly uses blob:none. An explicit filter
          # would override sparse-checkout in actions/checkout.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/ci.yml
            /scripts/ci/reuse-validation.mjs
      - uses: actions/github-script@v7
        id: plan
        with:
          script: |
            const {readCheckoutIdentity, findReusableValidation, receiptArtifactName} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/reuse-validation.mjs`);
            const identity = readCheckoutIdentity();
            const result = await findReusableValidation({github, context, ...identity, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT)});
            core.setOutput('reuse', String(result.reuse));
            core.setOutput('source_run_id', result.sourceRunId ?? '');
            core.setOutput('source_attempt', result.sourceAttempt ?? '');
            core.setOutput('tree', identity.tree);
            core.setOutput('checkout_sha', identity.checkoutSha);
            core.setOutput('workflow_blob_sha', identity.workflowBlobSha);
            core.setOutput('artifact_name', receiptArtifactName(identity.tree));
            core.info(result.reuse ? `Reusing verified full validation run ${result.sourceRunId}, attempt ${result.sourceAttempt}.` : `Full validation required: ${result.reason}`);

  static-checks:
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Sparse checkout implicitly uses blob:none. An explicit filter
          # would override sparse-checkout in actions/checkout.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            /data/streets/
            /data/neighborhoods/search-areas.geojson.gz
            /data/neighborhoods/sources/country-osm/municipalities.geojson.gz
            /data/neighborhoods/sources/country-osm/named-nodes.geojson.gz
      - uses: ./.github/actions/ci-node
      - name: Install the pinned workflow parser without lifecycle scripts
        run: npm install --prefix .local/ci-tools --no-save --no-package-lock --ignore-scripts --no-audit --no-fund yaml@2.8.2
      - name: Verify the embedded test catalog matches its source
        run: node scripts/gcp/export-demo-data.mjs --check
      - name: Verify all neighborhood geometry, municipality fixture points and generated runtime data
        run: |
          python3 scripts/import-neighborhoods.py --check
          python3 tests/neighborhood-runtime-data.test.py
      - name: Verify the pinned postal street source and generated catalogue
        run: |
          python3 scripts/import-streets.py --check
          python3 tests/street-data.test.py
      - name: Run JavaScript tests
        run: |
          node tests/model.test.mjs
          node tests/feedback.test.mjs
          node tests/seller-feedback-model.test.mjs
          node tests/matching.test.mjs
          node tests/public-profile.test.mjs
          node tests/smoke-privacy.test.mjs
          node tests/frontend.test.mjs
          node tests/api.test.mjs
          node tests/seller-feedback-api.test.mjs
          node tests/accounts.test.mjs
          node tests/development.test.mjs
          node tests/locations.test.mjs
          node tests/neighborhood-client.test.mjs
          node tests/neighborhood-map.test.mjs
          node tests/neighborhood-map-data.test.mjs
          node tests/street-client.test.mjs
          node tests/street-search-browser.test.mjs --offline
          node tests/areas.test.mjs
          node tests/regions.test.mjs
          node tests/attributes.test.mjs
          node tests/contact-policy.test.mjs
          node tests/gcp-deployment.test.mjs
          node tests/gcp-verification.test.mjs
          node tests/gcp-ci-validation.test.mjs
          node tests/gcp-run-config.test.mjs
          node tests/gcp-bootstrap.test.mjs
          node tests/gcp-mysql.test.mjs
          node tests/gcp-firebase.test.mjs
          node tests/gcp-runner.test.mjs
          node tests/gcp-push.test.mjs
          node tests/gcp-status.test.mjs
          node tests/gcp-seed.test.mjs
          node tests/demo-data.test.mjs
          node tests/startup-seed-packaging.test.mjs
          node tests/ci-workflow.test.mjs
          node tests/ci-checkout.test.mjs
          node tests/ci-reuse-validation.test.mjs
      - name: Check Cloud Shell script syntax
        run: |
          bash -n scripts/gcp/bootstrap-dev.sh
          bash -n scripts/gcp/deploy-dev.sh
          bash -n scripts/gcp/run-dev.sh
          bash -n scripts/gcp/push-image.sh
          python3 -m py_compile scripts/gcp/bootstrap-dev.py

  container-package:
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    name: Container packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Sparse checkout implicitly uses blob:none. An explicit filter
          # would override sparse-checkout in actions/checkout.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            /data/streets/
            /data/neighborhoods/search-areas.geojson.gz
            /data/neighborhoods/sources/country-osm/municipalities.geojson.gz
            /data/neighborhoods/sources/country-osm/named-nodes.geojson.gz
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker API with embedded location catalogue
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: otthonra-api:ci
          load: true
          push: false
          cache-from: type=gha,scope=otthonra-api-ci
          cache-to: type=gha,mode=max,scope=otthonra-api-ci
      - name: Verify the pinned Cloud SQL proxy image and required CLI flags
        run: |
          mkdir -p .local/proxy-smoke
          proxy_image='gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.26.3'
          docker pull "$proxy_image"
          docker run --rm "$proxy_image" --version > .local/proxy-smoke/version.txt
          docker run --rm "$proxy_image" --help > .local/proxy-smoke/help.txt
          python3 - <<'PY'
          from pathlib import Path
          version=Path('.local/proxy-smoke/version.txt').read_text()
          help_text=Path('.local/proxy-smoke/help.txt').read_text()
          assert '2.26.3' in version, 'Unexpected Cloud SQL proxy version'
          for flag in ['--address', '--port', '--structured-logs', '--health-check', '--http-address', '--http-port', '--lazy-refresh']:
              assert flag in help_text, 'Missing Cloud SQL proxy flag: '+flag
          print(version.strip())
          print('Pinned proxy CLI flags verified.')
          PY
          docker image inspect "$proxy_image" --format '{{json .RepoDigests}}'

  browser-tests:
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    name: Browser regression (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        group: [locations, workspace, onboarding]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Sparse checkout implicitly uses blob:none. An explicit filter
          # would override sparse-checkout in actions/checkout.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            /data/streets/
            /data/neighborhoods/search-areas.geojson.gz
            /data/neighborhoods/sources/country-osm/municipalities.geojson.gz
            /data/neighborhoods/sources/country-osm/named-nodes.geojson.gz
      - uses: ./.github/actions/ci-node
        with:
          browser: 'true'
      - name: Test every demo and isolated API browser scenario
        run: |
          mkdir -p .local/browser-tests
          python3 -m http.server 3000 --directory dist --bind 127.0.0.1 > .local/browser-tests/static-server.log 2>&1 &
          static_frontend_pid=$!
          trap 'kill "$static_frontend_pid" 2>/dev/null || true' EXIT
          node --input-type=module - <<'JS'
          const deadline = Date.now() + 10000;
          let ready = false;
          while (Date.now() < deadline) {
            try {
              const response = await fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(500)});
              if (response.ok) { ready = true; break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 200));
          }
          if (!ready) throw new Error('The static frontend did not become ready within ten seconds.');
          JS
          node scripts/ci/browser-runner.mjs '${{ matrix.group }}' http://127.0.0.1:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: static-browser-failure-${{ matrix.group }}
          include-hidden-files: true
          path: |
            .local/browser-tests/screenshots/*.png
            .local/browser-tests/static-*.log
          if-no-files-found: ignore

  guided-forms-and-discovery:
    name: Guided forms and discovery controls
    if: always()
    needs: [plan, browser-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@v7
        env:
          CI_BROWSER_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.CI_BROWSER_RESULTS);
            if (needs.plan?.result !== 'success') throw new Error('The browser validation plan did not succeed.');
            if (needs.plan.outputs.reuse === 'true') {
              if (context.eventName !== 'push' || context.ref !== 'refs/heads/main'
                || !/^[1-9][0-9]*$/.test(needs.plan.outputs.source_run_id ?? '')
                || !/^[1-9][0-9]*$/.test(needs.plan.outputs.source_attempt ?? '')
                || !/^[a-f0-9]{40}$/.test(needs.plan.outputs.tree ?? '')
                || needs['browser-tests']?.result !== 'skipped') {
                throw new Error('The reused browser validation is not bound to a verified main-branch plan.');
              }
              core.info('Browser validation is covered by the verified identical-tree full run.');
            } else if (needs['browser-tests']?.result !== 'success') {
              throw new Error('Every browser regression group must pass.');
            }

  postal-street-integration:
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    name: Postal street MySQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: otthonra_ci
          MYSQL_USER: otthonra
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="MYSQL_PWD=ci-only-password mysql -h 127.0.0.1 -u otthonra otthonra_ci -e 'SELECT 1' >/dev/null 2>&1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      ASPNETCORE_ENVIRONMENT: Production
      Deployment__Environment: test
      ConnectionStrings__MySql: Server=127.0.0.1;Port=3306;Database=otthonra_ci;User=otthonra;Password=ci-only-password
      Jwt__Key: ci-only-signing-key-for-disposable-test-environment-2026
      Database__Initialize: "true"
      Database__SeedDemo: "false"
      Database__SeedTestFixtures: "true"
      Geocoding__EnableTestGeocoder: "true"
      Credits__EnableDemoTopup: "true"
      K_REVISION: ci-fixtures-a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Sparse checkout implicitly uses blob:none. An explicit filter
          # would override sparse-checkout in actions/checkout.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            /data/streets/
            /data/neighborhoods/search-areas.geojson.gz
            /data/neighborhoods/sources/country-osm/municipalities.geojson.gz
            /data/neighborhoods/sources/country-osm/named-nodes.geojson.gz
      - uses: ./.github/actions/ci-dotnet
      - uses: ./.github/actions/ci-node
      - name: Build the actual API and verify packaged fixtures
        run: |
          dotnet restore backend/Otthonra.Api/Otthonra.Api.csproj
          dotnet build backend/Otthonra.Api/Otthonra.Api.csproj --no-restore
          node scripts/gcp/export-demo-data.mjs --check
      - name: Seed and record the native postal catalogue in its disposable database
        run: |
          node scripts/dev.mjs --background
          node backend/startup-seed-smoke.mjs http://127.0.0.1:3000 --initial
          python3 backend/startup-seed-store.py "${{ job.services.mysql.id }}" changed
          python3 backend/street-store-smoke.py "${{ job.services.mysql.id }}" record
      - name: Verify import idempotency and association-only versioned backfill
        run: |
          node scripts/dev.mjs --restart
          node backend/startup-seed-smoke.mjs http://127.0.0.1:3000 --preserved
          python3 backend/street-store-smoke.py "${{ job.services.mysql.id }}" verify
          python3 backend/street-store-smoke.py "${{ job.services.mysql.id }}" stale
          node scripts/dev.mjs --restart
          python3 backend/street-store-smoke.py "${{ job.services.mysql.id }}" rebuilt
          node scripts/dev.mjs --restart
          python3 backend/street-store-smoke.py "${{ job.services.mysql.id }}" verify
      - name: Verify exact street APIs and preserve the native catalogue through fixture reset
        run: |
          node backend/street-smoke.mjs http://127.0.0.1:3000
          K_REVISION=ci-fixtures-b node scripts/dev.mjs --restart
          node backend/startup-seed-smoke.mjs http://127.0.0.1:3000 --reset
          python3 backend/startup-seed-store.py "${{ job.services.mysql.id }}" reset
          python3 backend/street-store-smoke.py "${{ job.services.mysql.id }}" verify
      - name: Show postal integration startup logs on failure
        if: failure()
        run: tail -n 80 .local/dev.log 2>/dev/null || true
      - name: Stop postal integration supervisor
        if: always()
        run: node scripts/dev.mjs --stop

  onboarding-integration:
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    name: Anonymous onboarding browser and MySQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: otthonra_ci
          MYSQL_USER: otthonra
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="MYSQL_PWD=ci-only-password mysql -h 127.0.0.1 -u otthonra otthonra_ci -e 'SELECT 1' >/dev/null 2>&1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      ASPNETCORE_ENVIRONMENT: Production
      Deployment__Environment: test
      ConnectionStrings__MySql: Server=127.0.0.1;Port=3306;Database=otthonra_ci;User=otthonra;Password=ci-only-password
      Jwt__Key: ci-only-signing-key-for-disposable-test-environment-2026
      Database__Initialize: "true"
      Database__SeedDemo: "false"
      Database__SeedTestFixtures: "false"
      Geocoding__EnableTestGeocoder: "true"
      Credits__EnableDemoTopup: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Sparse checkout implicitly uses blob:none. An explicit filter
          # would override sparse-checkout in actions/checkout.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            /data/streets/
            /data/neighborhoods/search-areas.geojson.gz
            /data/neighborhoods/sources/country-osm/municipalities.geojson.gz
            /data/neighborhoods/sources/country-osm/named-nodes.geojson.gz
      - uses: ./.github/actions/ci-dotnet
      - uses: ./.github/actions/ci-node
      - name: Build onboarding API and verify hosted module packaging
        run: |
          dotnet restore backend/Otthonra.Api/Otthonra.Api.csproj
          dotnet build backend/Otthonra.Api/Otthonra.Api.csproj --no-restore
          node tests/onboarding.test.mjs
          node tests/gcp-deployment.test.mjs
      - name: Verify anonymous drafts and authenticated creation before the legacy suite
        run: |
          node scripts/dev.mjs --background
          node backend/onboarding-smoke.mjs http://127.0.0.1:3000
          python3 backend/onboarding-store.py "${{ job.services.mysql.id }}"
          node scripts/dev.mjs --restart
          node backend/onboarding-smoke.mjs http://127.0.0.1:3000 --verify
          python3 backend/onboarding-store.py "${{ job.services.mysql.id }}"
      - name: Verify account-wide activity notifications, feedback and legacy receipt upgrades
        run: |
          node backend/activity-notifications-smoke.mjs http://127.0.0.1:3000
          python3 backend/activity-notifications-store.py "${{ job.services.mysql.id }}" --prepare-feedback
          node backend/activity-notifications-smoke.mjs http://127.0.0.1:3000 --feedback
          python3 backend/activity-notifications-store.py "${{ job.services.mysql.id }}"
          node scripts/dev.mjs --stop
          python3 backend/activity-notifications-store.py "${{ job.services.mysql.id }}" --prepare-upgrade
          node scripts/dev.mjs --background
          node backend/activity-notifications-smoke.mjs http://127.0.0.1:3000 --verify-upgrade
          python3 backend/activity-notifications-store.py "${{ job.services.mysql.id }}"
          node scripts/dev.mjs --restart
          node backend/activity-notifications-smoke.mjs http://127.0.0.1:3000 --verify
          python3 backend/activity-notifications-store.py "${{ job.services.mysql.id }}"
      - name: Show onboarding startup logs on failure
        if: failure()
        run: tail -n 80 .local/dev.log 2>/dev/null || true
      - name: Stop onboarding integration supervisor
        if: always()
        run: node scripts/dev.mjs --stop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: onboarding-browser-failure
          include-hidden-files: true
          path: .local/browser-tests/screenshots/onboarding-*.png
          if-no-files-found: ignore

  build-and-test:
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    name: Build and test (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "8.4"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_DATABASE: otthonra_ci
          MYSQL_USER: otthonra
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="MYSQL_PWD=ci-only-password mysql -h 127.0.0.1 -u otthonra otthonra_ci -e 'SELECT 1' >/dev/null 2>&1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MySql: Server=127.0.0.1;Port=3306;Database=otthonra_ci;User=otthonra;Password=ci-only-password
      Jwt__Key: ci-only-signing-key-for-disposable-test-environment-2026
      Database__Initialize: "true"
      Database__SeedDemo: "true"
      Database__SeedTestFixtures: "false"
      Geocoding__EnableTestGeocoder: "true"
      Credits__EnableDemoTopup: "true"
      OTTHONRA_UPGRADE_FIXTURE: .local/upgrade-fixture.json
      OTTHONRA_TEST_MYSQL_CACHING_SHA2: "true"
      OTTHONRA_TEST_MYSQL_USER: otthonra_proxy_ci
      OTTHONRA_TEST_MYSQL_PASSWORD: ci-only-proxy-password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Sparse checkout implicitly uses blob:none. An explicit filter
          # would override sparse-checkout in actions/checkout.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            /data/streets/
            /data/neighborhoods/search-areas.geojson.gz
            /data/neighborhoods/sources/country-osm/municipalities.geojson.gz
            /data/neighborhoods/sources/country-osm/named-nodes.geojson.gz
      - uses: ./.github/actions/ci-dotnet
      - uses: ./.github/actions/ci-node
        with:
          browser: 'true'
      - name: Restore and build .NET
        run: |
          dotnet restore backend/Otthonra.Tests/Otthonra.Tests.csproj
          dotnet build backend/Otthonra.Tests/Otthonra.Tests.csproj --configuration Release --no-restore
      - name: Create a fresh account for the proxy TCP authentication regression
        run: docker exec --env MYSQL_PWD=ci-only-root-password "${{ job.services.mysql.id }}" mysql --user=root --execute="CREATE USER 'otthonra_proxy_ci'@'%' IDENTIFIED WITH caching_sha2_password BY 'ci-only-proxy-password'; GRANT SELECT ON otthonra_ci.* TO 'otthonra_proxy_ci'@'%';"
      - name: Run .NET unit tests
        run: dotnet test backend/Otthonra.Tests/Otthonra.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Start the actual development supervisor with seeded MySQL
        run: node scripts/dev.mjs --background
      - name: Test real development restarts, recovery and configured ports
        run: node tests/development-smoke.mjs
      - name: Test real MySQL and API flows through web proxy
        run: node backend/smoke.mjs http://127.0.0.1:3000
      - name: Verify imported neighborhood polygons, exact addresses and matching through MySQL
        run: |
          node backend/neighborhood-smoke.mjs http://127.0.0.1:3000 --setup "${{ job.services.mysql.id }}"
          node scripts/dev.mjs --restart
          node backend/neighborhood-smoke.mjs http://127.0.0.1:3000 --verify "${{ job.services.mysql.id }}"
          node backend/neighborhood-smoke.mjs http://127.0.0.1:3000 --stale "${{ job.services.mysql.id }}"
          node scripts/dev.mjs --restart
          node backend/neighborhood-smoke.mjs http://127.0.0.1:3000 --rebuilt "${{ job.services.mysql.id }}"
          node scripts/dev.mjs --restart
          node backend/neighborhood-smoke.mjs http://127.0.0.1:3000 --verify "${{ job.services.mysql.id }}"
      - name: Test graded matching, ranking and consent through the real MySQL API
        run: |
          node backend/matching-smoke.mjs http://127.0.0.1:3000
          python3 backend/matching-store-smoke.py "${{ job.services.mysql.id }}"
      - name: Preserve an existing notification table through the feedback upgrade
        run: |
          node scripts/dev.mjs --stop
          python3 backend/seller-feedback-store.py "${{ job.services.mysql.id }}" legacy-notification
          node scripts/dev.mjs --background
          python3 backend/seller-feedback-store.py "${{ job.services.mysql.id }}" upgraded-notification
          node scripts/dev.mjs --restart
          python3 backend/seller-feedback-store.py "${{ job.services.mysql.id }}" preserved-notification
      - name: Verify seller statistics, paid feedback, quota races and exactly-once package refunds
        run: |
          node backend/seller-feedback-smoke.mjs http://127.0.0.1:3000 --setup
          python3 backend/seller-feedback-store.py "${{ job.services.mysql.id }}" prime
          node backend/seller-feedback-smoke.mjs http://127.0.0.1:3000 --responses
          python3 backend/seller-feedback-store.py "${{ job.services.mysql.id }}" capacity
          node backend/seller-feedback-smoke.mjs http://127.0.0.1:3000 --capacity
          python3 backend/seller-feedback-store.py "${{ job.services.mysql.id }}" age
          node backend/seller-feedback-smoke.mjs http://127.0.0.1:3000 --expired
          python3 backend/seller-feedback-store.py "${{ job.services.mysql.id }}" record
          node scripts/dev.mjs --restart
          node backend/seller-feedback-smoke.mjs http://127.0.0.1:3000 --preserved
          python3 backend/seller-feedback-store.py "${{ job.services.mysql.id }}" verify
      - name: Simulate the previous schema in the disposable CI database
        run: |
          node scripts/dev.mjs --stop
          docker exec -i --env MYSQL_PWD=ci-only-password "${{ job.services.mysql.id }}" mysql --user=otthonra otthonra_ci < backend/fixtures/previous-schema.sql
      - name: Upgrade existing data and verify preservation
        run: |
          node scripts/dev.mjs --background
          node backend/upgrade-smoke.mjs http://127.0.0.1:3000
          python3 backend/onboarding-store.py "${{ job.services.mysql.id }}" --schema-only
      - name: Verify schema upgrade is idempotent
        run: |
          node scripts/dev.mjs --stop
          node scripts/dev.mjs --background
          node backend/upgrade-smoke.mjs http://127.0.0.1:3000
          python3 backend/onboarding-store.py "${{ job.services.mysql.id }}" --schema-only
      - name: Verify canonical search location backfill and covering indexes
        run: python3 backend/matching-store-smoke.py "${{ job.services.mysql.id }}"
      - name: Verify attributes, city areas and seller fields against MySQL and after a restart
        run: |
          node backend/attributes-smoke.mjs http://127.0.0.1:3000
          node backend/areas-smoke.mjs http://127.0.0.1:3000
          node backend/seller-form-smoke.mjs http://127.0.0.1:3000
          node scripts/dev.mjs --restart
          node backend/attributes-smoke.mjs http://127.0.0.1:3000 --verify
          node backend/areas-smoke.mjs http://127.0.0.1:3000 --verify
          node backend/seller-form-smoke.mjs http://127.0.0.1:3000 --verify
      - name: Verify broker billing, reports and UTC timestamp persistence
        run: |
          node scripts/dev.mjs --restart
          node backend/broker-smoke.mjs http://127.0.0.1:3000
          python3 backend/report-store-smoke.py "${{ job.services.mysql.id }}" record
          node scripts/dev.mjs --restart
          node backend/broker-smoke.mjs http://127.0.0.1:3000 --verify
          python3 backend/report-store-smoke.py "${{ job.services.mysql.id }}" verify
      - name: Verify incoming likes, account visibility and report-reason migration
        run: |
          node scripts/dev.mjs --restart
          node backend/interaction-smoke.mjs http://127.0.0.1:3000
          python3 backend/interaction-store-smoke.py "${{ job.services.mysql.id }}" record
          node scripts/dev.mjs --restart
          node backend/interaction-smoke.mjs http://127.0.0.1:3000 --verify
          python3 backend/interaction-store-smoke.py "${{ job.services.mysql.id }}" verify
          node scripts/dev.mjs --stop
          python3 backend/interaction-store-smoke.py "${{ job.services.mysql.id }}" legacy
          node scripts/dev.mjs --background
          node backend/interaction-smoke.mjs http://127.0.0.1:3000 --legacy-upgrade
          python3 backend/interaction-store-smoke.py "${{ job.services.mysql.id }}" upgraded
          node scripts/dev.mjs --restart
          python3 backend/interaction-store-smoke.py "${{ job.services.mysql.id }}" upgraded
      - name: Verify public landing privacy, reports and exactly-once overdue refunds on MySQL
        run: |
          node scripts/dev.mjs --restart
          node backend/landing-refund-smoke.mjs http://127.0.0.1:3000 --setup
          node scripts/dev.mjs --restart
          python3 backend/refund-store-smoke.py "${{ job.services.mysql.id }}" age
          node backend/landing-refund-smoke.mjs http://127.0.0.1:3000 --verify
          python3 backend/refund-store-smoke.py "${{ job.services.mysql.id }}" record
          node scripts/dev.mjs --restart
          node backend/landing-refund-smoke.mjs http://127.0.0.1:3000 --preserved
          python3 backend/refund-store-smoke.py "${{ job.services.mysql.id }}" verify
      - name: Verify diverse public samples change on refresh inside the candidate cache
        run: |
          node backend/landing-selection-smoke.mjs http://127.0.0.1:3000 --setup
          node scripts/dev.mjs --restart
          node backend/landing-selection-smoke.mjs http://127.0.0.1:3000 --verify
      - name: Start the API with the hosted test configuration
        run: |
          node scripts/dev.mjs --stop
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=test Database__SeedDemo=false node scripts/dev.mjs --background
      - name: Verify hosted test deployment capabilities
        run: |
          node backend/deployment-smoke.mjs http://127.0.0.1:3000 test
          node backend/smoke.mjs http://127.0.0.1:3000
      - name: Test hosted login, persistence and test credits in Chromium
        run: node tests/hosted-browser.test.mjs http://127.0.0.1:3000
      - name: Verify ordinary Production never exposes free credits
        run: |
          node scripts/dev.mjs --stop
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=production Geocoding__EnableTestGeocoder=false Database__SeedDemo=false node scripts/dev.mjs --background
          node backend/deployment-smoke.mjs http://127.0.0.1:3000 production
      - name: Verify embedded test fixtures and safe resets per deployment revision
        run: |
          node scripts/dev.mjs --stop
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=test Database__SeedDemo=false Database__SeedTestFixtures=true K_REVISION=ci-fixtures-a node scripts/dev.mjs --background
          node backend/startup-seed-smoke.mjs http://127.0.0.1:3000 --initial
          python3 backend/startup-seed-store.py "${{ job.services.mysql.id }}" changed
          python3 backend/street-store-smoke.py "${{ job.services.mysql.id }}" record
          node scripts/dev.mjs --stop
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=test Database__SeedDemo=false Database__SeedTestFixtures=true K_REVISION=ci-fixtures-a node scripts/dev.mjs --background
          node backend/startup-seed-smoke.mjs http://127.0.0.1:3000 --preserved
          python3 backend/street-store-smoke.py "${{ job.services.mysql.id }}" verify
          python3 backend/street-store-smoke.py "${{ job.services.mysql.id }}" stale
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=test Database__SeedDemo=false Database__SeedTestFixtures=true K_REVISION=ci-fixtures-a node scripts/dev.mjs --restart
          python3 backend/street-store-smoke.py "${{ job.services.mysql.id }}" rebuilt
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=test Database__SeedDemo=false Database__SeedTestFixtures=true K_REVISION=ci-fixtures-a node scripts/dev.mjs --restart
          python3 backend/street-store-smoke.py "${{ job.services.mysql.id }}" verify
          node backend/street-smoke.mjs http://127.0.0.1:3000
          node scripts/dev.mjs --stop
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=test Database__SeedDemo=false Database__SeedTestFixtures=true K_REVISION=ci-fixtures-b node scripts/dev.mjs --background
          node backend/startup-seed-smoke.mjs http://127.0.0.1:3000 --reset
          python3 backend/startup-seed-store.py "${{ job.services.mysql.id }}" reset
          python3 backend/street-store-smoke.py "${{ job.services.mysql.id }}" verify
          node scripts/dev.mjs --stop
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=test Database__SeedDemo=false Database__SeedTestFixtures=true K_REVISION=ci-fixtures-a node scripts/dev.mjs --background
          node backend/startup-seed-smoke.mjs http://127.0.0.1:3000 --preserved
          node scripts/dev.mjs --stop
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=production Geocoding__EnableTestGeocoder=false Database__SeedDemo=false Database__SeedTestFixtures=true K_REVISION=ci-fixtures-production node scripts/dev.mjs --background
          node backend/startup-seed-smoke.mjs http://127.0.0.1:3000 --production
          python3 backend/startup-seed-store.py "${{ job.services.mysql.id }}" reset
          python3 backend/street-store-smoke.py "${{ job.services.mysql.id }}" verify
      - name: Test the repeatable hosted feedback scenario on desktop, tablet and mobile
        run: |
          node scripts/dev.mjs --stop
          ASPNETCORE_ENVIRONMENT=Production Deployment__Environment=test Database__SeedDemo=false Database__SeedTestFixtures=true K_REVISION=ci-fixtures-b node scripts/dev.mjs --background
          node tests/feedback-scenario-browser.test.mjs http://127.0.0.1:3000
      - name: Show development startup logs on failure
        if: failure()
        run: tail -n 80 .local/dev.log 2>/dev/null || true
      - name: Stop development supervisor
        if: always()
        run: node scripts/dev.mjs --stop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results-mysql-${{ matrix.mysql }}
          path: backend/Otthonra.Tests/TestResults/*.trx
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-screenshots-mysql-${{ matrix.mysql }}
          include-hidden-files: true
          path: .local/browser-tests/screenshots/*.png
          if-no-files-found: ignore

  seed-importer:
    needs: plan
    if: needs.plan.outputs.reuse != 'true'
    name: Test data importer (MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "8.4"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_DATABASE: otthonra_ci
          MYSQL_USER: otthonra
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="MYSQL_PWD=ci-only-password mysql -h 127.0.0.1 -u otthonra otthonra_ci -e 'SELECT 1' >/dev/null 2>&1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      ASPNETCORE_ENVIRONMENT: Production
      Deployment__Environment: test
      ConnectionStrings__MySql: Server=127.0.0.1;Port=3306;Database=otthonra_ci;User=otthonra;Password=ci-only-password
      Jwt__Key: ci-only-signing-key-for-disposable-test-environment-2026
      Database__Initialize: "true"
      Database__SeedDemo: "false"
      Database__SeedTestFixtures: "false"
      Geocoding__EnableTestGeocoder: "true"
      Credits__EnableDemoTopup: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Sparse checkout implicitly uses blob:none. An explicit filter
          # would override sparse-checkout in actions/checkout.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            /data/streets/
            /data/neighborhoods/search-areas.geojson.gz
            /data/neighborhoods/sources/country-osm/municipalities.geojson.gz
            /data/neighborhoods/sources/country-osm/named-nodes.geojson.gz
      - uses: ./.github/actions/ci-dotnet
      - uses: ./.github/actions/ci-node
      - name: Build the actual API for the importer
        run: |
          dotnet restore backend/Otthonra.Api/Otthonra.Api.csproj
          dotnet build backend/Otthonra.Api/Otthonra.Api.csproj --no-restore
      - name: Verify test fixtures and preservation through the real MySQL API
        run: |
          node scripts/dev.mjs --background
          node backend/seed-smoke.mjs http://127.0.0.1:3000
      - name: Show importer startup logs on failure
        if: failure()
        run: tail -n 80 .local/dev.log 2>/dev/null || true
      - name: Stop importer integration supervisor
        if: always()
        run: node scripts/dev.mjs --stop

  ci-validation:
    name: CI validation
    if: always()
    needs: [plan, static-checks, container-package, browser-tests, guided-forms-and-discovery, postal-street-integration, onboarding-integration, build-and-test, seed-importer]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Sparse checkout implicitly uses blob:none. An explicit filter
          # would override sparse-checkout in actions/checkout.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/ci.yml
            /scripts/ci/reuse-validation.mjs
      - uses: actions/github-script@v7
        id: validation
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const {mkdir, writeFile} = await import('node:fs/promises');
            const {readCheckoutIdentity, validateReusedPlan, makeValidationReceipt} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/reuse-validation.mjs`);
            const needs = JSON.parse(process.env.CI_JOB_RESULTS);
            if (needs.plan?.result !== 'success') throw new Error('The CI validation plan did not succeed.');
            const identity = readCheckoutIdentity();
            for (const [output, key] of [['tree','tree'], ['checkout_sha','checkoutSha'], ['workflow_blob_sha','workflowBlobSha']]) {
              if (needs.plan.outputs[output] !== identity[key]) throw new Error('The CI checkout identity changed after planning.');
            }
            if (needs.plan.outputs.reuse === 'true') {
              validateReusedPlan({context, identity, plan: needs.plan});
              core.info(`CI validated by verified full run ${needs.plan.outputs.source_run_id} for the identical Git tree.`);
              core.setOutput('full_validation', 'false');
            } else {
              const receipt = makeValidationReceipt({context, ...identity, runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT), needs});
              await mkdir('.local/ci', {recursive: true});
              await writeFile('.local/ci/receipt.json', JSON.stringify(receipt) + '\n');
              core.setOutput('full_validation', 'true');
              core.info('Every required CI job passed. Full-tree validation receipt prepared.');
            }
      - uses: actions/upload-artifact@v4
        if: steps.validation.outputs.full_validation == 'true'
        with:
          name: ${{ needs.plan.outputs.artifact_name }}
          path: .local/ci/receipt.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          overwrite: true
