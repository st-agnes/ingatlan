name: Collect supplemental public neighborhood sources

on:
  push:
    branches: [codex/neighborhood-source-downloads]
    paths:
      - .github/workflows/neighborhood-supplement.yml
      - scripts/neighborhoods/collect-public-supplement.py
      - data/neighborhoods/research/supplement-sources.json
      - tests/neighborhood-supplement.test.py
  workflow_dispatch:
  create:

permissions:
  contents: read

concurrency:
  group: neighborhood-supplement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    if: github.ref_name == 'codex/neighborhood-source-downloads' && contains(fromJSON('["push","create","workflow_dispatch"]'), github.event_name)
    name: Collect ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source:
          - veszprem-tak2019
          - zalaegerszeg-ziffa2025
          - kaposvar-belvaros2009
          - kaposvar-fvs
          - szentendre-public
          - szeged-public
          - arcgis-varosreszek
          - arcgis-varosresz
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF reader
        run: python -m pip install PyMuPDF==1.26.6
      - name: Verify collector with offline fixtures
        run: python3 tests/neighborhood-supplement.test.py
      - name: Collect one cited public source
        run: >-
          python3 scripts/neighborhoods/collect-public-supplement.py
          --sources data/neighborhoods/research/supplement-sources.json
          --source '${{ matrix.source }}'
          --output '.local/public-supplement/${{ matrix.source }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-supplement-${{ matrix.source }}
          path: .local/public-supplement/${{ matrix.source }}/artifact.zip
          if-no-files-found: warn
          retention-days: 14
