services:
  development:
    image: mcr.microsoft.com/devcontainers/dotnet:1-8.0-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/ingatlan:cached
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MySql: Server=mysql;Port=3306;Database=otthonra;User=otthonra;Password=development-container-only
      Database__Initialize: "true"
      Database__SeedDemo: "true"
      Credits__EnableDemoTopup: "true"
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: otthonra
      MYSQL_USER: otthonra
      MYSQL_PASSWORD: development-container-only
      MYSQL_ROOT_PASSWORD: development-container-root-only
    volumes:
      - development_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s
volumes:
  development_mysql:
