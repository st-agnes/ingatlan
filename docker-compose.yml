services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: otthonra
      MYSQL_USER: otthonra
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__MySql: "Server=mysql;Port=3306;Database=otthonra;User=otthonra;Password=${MYSQL_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Cors__Origins__0: ${FRONTEND_ORIGIN:-http://localhost:8080}
      Database__Initialize: ${DATABASE_INITIALIZE:-true}
      Database__SeedDemo: ${SEED_DEMO:-true}
      Credits__EnableDemoTopup: ${ENABLE_DEMO_TOPUP:-true}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Stripe__SuccessUrl: ${STRIPE_SUCCESS_URL:-http://localhost:8080/?payment=success#credits}
      Stripe__CancelUrl: ${STRIPE_CANCEL_URL:-http://localhost:8080/?payment=cancel#credits}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
volumes:
  mysql_data:
